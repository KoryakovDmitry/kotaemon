version: '3.7'

services:
  text-embeddings-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:1.6
    restart: always
    runtime: nvidia
    ports:
      - "8111:80"
    volumes:
      - ./ktem_app_data_text_embeddings_rerank:/data
    command: --model-id BAAI/bge-reranker-large
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=${TZ:-Europe/Luxembourg}
  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:0.0.9
    restart: always
    environment:
      - TZ=${TZ:-Europe/Luxembourg}
      - PORT=${PORT:-8000}
    ports:
      - '8000:8000'
    networks:
      - overlay
  web-rag:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    hostname: "web-rag"
    networks:
      - overlay
    environment:
      - TZ=${TZ:-Europe/Luxembourg}
      - API_KEY=${API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - GRAPHRAG_API_BASE=${GRAPHRAG_API_BASE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GRAPHRAG_API_KEY=${GRAPHRAG_API_KEY}
      - GRAPHRAG_EMBEDDING_MODEL=${GRAPHRAG_EMBEDDING_MODEL}
      - GRAPHRAG_LLM_MODEL=${GRAPHRAG_LLM_MODEL}
      - GRADIO_SERVER_NAME=${GRADIO_SERVER_PORT:-0.0.0.0}
      - GRADIO_SERVER_PORT=${GRADIO_SERVER_PORT:-6574}
      - LOCAL_MODEL=${LOCAL_MODEL:-EuroLLM-9B-Instruct}
      - KH_DEMO_MODE=${KH_DEMO_MODE:-false}
      - KH_OLLAMA_URL=${KH_OLLAMA_URL:-http://host.docker.internal:11434/v1/}
    ports:
      - '6574:6574'
    volumes:
      - ./ktem_app_data:/app/ktem_app_data
networks:
  overlay:
    driver: "bridge"